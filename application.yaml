apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argocd-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SlyyTata/testie-eks-app
    targetRevision: HEAD
    path: '.'
  destination:
    server: "https://kubernetes.default.svc"
    namespace: myapp

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
