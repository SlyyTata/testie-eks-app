apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: realmile
  annotations:
    # Send traffic straight to pod IPs (our Services are ClusterIP)
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web
            port:
              number: 3000
