apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  # Fail once and stop the deploy; don't retry a broken migration
  backoffLimit: 0
  # Give up if it hangs (e.g. a lock on the database)
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: migrate
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: migrate
        image: API_IMAGE_PLACEHOLDER
        command: ["python", "-m", "app.migrate"]
        envFrom:
            - secretRef:
                name: api-env
        resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              memory: 512Mi